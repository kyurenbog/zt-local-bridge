plugins { id 'com.android.application' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
android {
    namespace 'org.ztbridge.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.ztbridge.android'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.4.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DZTS_ENABLE_JAVA=ON'; targets 'zt-shared', 'bridgeio' } }
    }
    sourceSets.main.java.srcDir '../vendor/libzt/src/bindings/java'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyUpstreamNotices', Copy) {
    from('../vendor/libzt') {
        include '**/LICENSE*', '**/COPYING*', '**/AUTHORS*', '**/COPYRIGHT*'
        exclude '**/.git/**', '**/build/**'
    }
    into layout.buildDirectory.dir('generated/upstream-assets/upstream-notices')
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/upstream-assets')
tasks.named('preBuild').configure { dependsOn 'copyUpstreamNotices' }
